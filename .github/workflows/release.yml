# Publishes the platform gems to rubygems.org through OIDC trusted publishing —
# no API key stored anywhere. Prerequisite (one-time, on rubygems.org): the gem
# mcptask-rails-runner must have a trusted publisher configured for this
# repository and this workflow file.
#
# Release procedure:
#   1. Bump lib/mcptask_rails_runner/version.rb to <VERSION>, commit, push.
#   2. Tag the Go repository: git tag -a v<VERSION> && git push origin v<VERSION>
#   3. Tag this one the same way — no need to wait for step 2 to finish.
#
# Step 3 used to say "wait": the binaries only exist once goreleaser has
# finished, and v0.3.0's gem release started three minutes early, failed on the
# download and had to be re-run by hand. The fetch below waits for them instead,
# so the two tags can go back to back.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # mandatory for rubygems trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Tag must match the gem version
        run: |
          ruby -r./lib/mcptask_rails_runner/version -e '
            tag = ENV.fetch("GITHUB_REF_NAME")
            abort "tag #{tag} does not match gem version v#{McptaskRailsRunner::VERSION}" \
              unless tag == "v#{McptaskRailsRunner::VERSION}"'

      - name: Fetch Go binaries from mcptask-releases (sha256-verified)
        # Long enough for the Go release to finish if it is still running (it
        # takes about 215s), short enough that a release which is never coming
        # fails inside the run rather than holding a runner for hours.
        env:
          MCPTASK_WAIT_FOR_RELEASE: "900"
        run: bin/fetch-binaries

      - name: Build all platform gems
        run: bundle exec rake package:all

      - uses: rubygems/configure-rubygems-credentials@main

      - name: Push every gem
        run: |
          for gem in pkg/*.gem; do
            gem push "$gem"
          done
