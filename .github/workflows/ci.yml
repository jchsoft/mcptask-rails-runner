name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.0", "3.4"]
        exclude:
          # setup-ruby has no arm64 3.0 build for current macOS runners
          - os: macos-latest
            ruby: "3.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  e2e:
    name: e2e in a generated Rails app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem install rails --no-document
      # The latest released binary, not the one this gem's version names.
      #
      # version.rb is bumped in the commit that prepares a release, and the
      # matching binary tag is pushed after it — so between those two moments
      # `bin/fetch-binaries` with no argument 404s and main goes red for a
      # reason that is not a defect. This job proves the wrapper works in a real
      # Rails app, and any released binary proves that. The exact-version match
      # belongs to release.yml, which refuses a tag that disagrees with
      # version.rb and then fetches that exact release.
      - name: Stage the latest released linux binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          released=$(gh release view --repo jchsoft/mcptask-releases --json tagName --jq .tagName)
          echo "gem version is v$(ruby -r./lib/mcptask_rails_runner/version -e 'print McptaskRailsRunner::VERSION'), staging $released"
          bin/fetch-binaries "$released"
          cp tmp/binaries/linux_amd64/mcptask_runner libexec/mcptask_runner
          chmod +x libexec/mcptask_runner
      - run: bin/e2e-host-app

  package:
    name: package smoke (ruby fallback gem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake package:ruby
      - run: gem install pkg/*.gem
      - name: bundled require works and error message is instructive
        run: |
          ruby -e 'require "mcptask/rails/runner"
                   begin
                     McptaskRailsRunner::Binary.path
                     abort "expected an error from the binary-less fallback gem"
                   rescue McptaskRailsRunner::Error => e
                     raise unless e.message.include?("MCPTASK_RUNNER_BIN")
                     puts "fallback gem raises instructive error - OK"
                   end'
